[workspace]
resolver = "2"
members = [
    "crates/forge_engine",
    "crates/forge_models",
    "crates/forge_runtime",
    "crates/forge_store",
    "crates/forge_api",
    "crates/forge_cli",
    "crates/forge_tauri",
    "crates/forge_wgpu_core",
    "crates/forge_wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Forge Contributors"]
repository = "https://github.com/forge/forge"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-util = "0.7"

# HTTP server
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Configuration
config = "0.14"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# WebGPU
wgpu = { version = "23.0", features = ["webgpu", "webgl"] }
bytemuck = { version = "1.14", features = ["derive"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Time/date
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

# Filesystem
walkdir = "2.4"

# Tauri
tauri = { version = "2.1", features = [] }
tauri-build = "2.0"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "WebGl2RenderingContext", "Gpu"] }

# Utilities
futures = "0.3"
bytes = "1.5"
async-trait = "0.1"
parking_lot = "0.12"

# Testing
tokio-test = "0.4"
tempfile = "3.8"
