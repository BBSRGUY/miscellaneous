[workspace]
resolver = "2"
members = [
    "crates/blang_common",
    "crates/blang_span",
    "crates/blang_diagnostics",
    "crates/blang_lexer",
    "crates/blang_ast",
    "crates/blang_parser",
    "crates/blang_resolve",
    "crates/blang_types",
    "crates/blang_typeck",
    "crates/blang_ir",
    "crates/blang_borrow",
    "crates/blang_optimize",
    "crates/blang_codegen_wasm",
    "crates/blang_codegen_js",
    "crates/blang_component",
    "crates/blang_script",
    "crates/blang_runtime",
    "crates/blang_job_engine",
    "crates/blang_driver",
    "crates/blang_cli",
    "crates/blang_dev_server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Blang Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/blang-lang/blang"
homepage = "https://blang-lang.org"
documentation = "https://docs.blang-lang.org"

[workspace.dependencies]
# Internal crates
blang_common = { path = "crates/blang_common", version = "0.1.0" }
blang_span = { path = "crates/blang_span", version = "0.1.0" }
blang_diagnostics = { path = "crates/blang_diagnostics", version = "0.1.0" }
blang_lexer = { path = "crates/blang_lexer", version = "0.1.0" }
blang_ast = { path = "crates/blang_ast", version = "0.1.0" }
blang_parser = { path = "crates/blang_parser", version = "0.1.0" }
blang_resolve = { path = "crates/blang_resolve", version = "0.1.0" }
blang_types = { path = "crates/blang_types", version = "0.1.0" }
blang_typeck = { path = "crates/blang_typeck", version = "0.1.0" }
blang_ir = { path = "crates/blang_ir", version = "0.1.0" }
blang_borrow = { path = "crates/blang_borrow", version = "0.1.0" }
blang_optimize = { path = "crates/blang_optimize", version = "0.1.0" }
blang_codegen_wasm = { path = "crates/blang_codegen_wasm", version = "0.1.0" }
blang_codegen_js = { path = "crates/blang_codegen_js", version = "0.1.0" }
blang_component = { path = "crates/blang_component", version = "0.1.0" }
blang_script = { path = "crates/blang_script", version = "0.1.0" }
blang_runtime = { path = "crates/blang_runtime", version = "0.1.0" }
blang_driver = { path = "crates/blang_driver", version = "0.1.0" }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Data structures
indexmap = "2.1"
rustc-hash = "1.1"
smallvec = "1.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
bitflags = "2.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI tools
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.1"
indicatif = "0.17"

# Web Assembly
wasm-encoder = "0.38"
wasmparser = "0.118"
walrus = "0.20"

# Dev server dependencies
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
notify = "6.1"
tokio-tungstenite = "0.21"

# Testing
insta = "1.34"
proptest = "1.4"
criterion = "0.5"
wasmtime = "16.0"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 1
debug = true

[profile.bench]
opt-level = 3
debug = false
