[package]
name = "blang_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "blang"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File I/O and paths
walkdir = "2.5"

# File watching for dev server
notify = "6.1"

# Web server for dev mode
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async streams
async-stream = "0.3"

# Blang compiler crates
blang_lexer = { workspace = true }
blang_parser = { workspace = true }
blang_ast = { workspace = true }
blang_ir = { workspace = true }
blang_codegen_wasm = { workspace = true }

[dev-dependencies]
tempfile = "3.13"
