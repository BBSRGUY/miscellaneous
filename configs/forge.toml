# Forge Configuration File
# This is the default configuration for the Forge platform

[daemon]
# Port for the HTTP API server
port = 3000
# Host to bind to (use 0.0.0.0 to allow external connections)
host = "127.0.0.1"

[storage]
# Database file path (relative to data directory)
database = "forge.db"
# Directory for model storage
models_dir = "models"
# Directory for datasets
datasets_dir = "datasets"

[inference]
# Maximum concurrent inference tasks
max_concurrent_tasks = 4
# Default temperature for completions
default_temperature = 0.7
# Default max tokens
default_max_tokens = 2048

[gpu]
# Enable GPU acceleration
enabled = true
# Prefer high performance GPU
high_performance = true

[logging]
# Log level: trace, debug, info, warn, error
level = "info"
# Log to file
file_enabled = false
# Log file path
file_path = "forge.log"
